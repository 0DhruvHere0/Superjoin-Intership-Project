<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fact Knowledge Layer</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/app.js" defer></script>
</head>
<body>
    <main class="container">
        <header>
            <h1>Upload PDF documents and inspect grounded facts and relationships</h1>
        </header>
        <section class="panel">
            <h2>Upload a PDF</h2>
            <form id="upload-form">
                <input
                    id="pdf-file"
                    type="file"
                    accept=".pdf,application/pdf"
                    required
                >
                <button type="submit">
                    Upload PDF
                </button>
            </form>
            <div id="message" class="message" hidden></div>
        </section>
        <div class="layout">
            <aside class="sidebar">
                <h2>Documents</h2>
                <div id="document-list"></div>
            </aside>
            <section class="content">
                <div id="document-detail">
                    <p class="empty">
                        Select a document to view its results.
                    </p>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
